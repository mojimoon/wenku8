name: Build EPUB

# 每次运行：抓取论坛新帖 / 蓝奏下载列表、刷新 wenku8 目录并合并数据（原 scrape.yml），
# 再为「仅 TXT 源」的小说从 wenku8 重新抓取并生成分卷 EPUB，上传到 Release（epub-NN），最后触发 Pages 部署。
# 状态记录在 out/epub_index.json：仅当 TXT 源有更新时才会重新生成。
# 为降低被识别为爬虫的风险，每天分 6 次短时运行（起始时间随机推迟 0~20 分钟），
# 每次累计约 40 分钟后完成当前这本书就结束，剩余的由下次运行继续。
on:
  schedule:
    - cron: '43 1/4 * * *'
  workflow_dispatch:
    inputs:
      max_novels:
        description: '本次最多处理的小说数（0=不限，受时间预算约束）'
        type: number
        default: 0
      time_budget:
        description: '时间预算（分钟）：超过后完成当前这本就结束'
        type: number
        default: 40
      aid:
        description: '只处理指定 aid（空格分隔，留空=自动选择）'
        type: string
        default: ''
  push:
    branches: [beta]
    paths: [.github/workflows/build_epub.yml]

permissions:
  contents: write
  actions: write

# 与按需生成共用并发组：同一时间只有一个任务在抓取 wenku8
concurrency:
  group: wenku8-crawl
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Random delay
        if: github.event_name == 'schedule'
        run: sleep $((RANDOM % 1200))

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Setup cookie
        run: echo "${{ secrets.WENKU_COOKIES }}" > COOKIE

      # 抓取失败（如 Cloudflare 拦截）不影响后面的生成，沿用仓库中现有的数据
      - name: Scrape posts, refresh catalog, merge
        if: github.event_name != 'push' && inputs.aid == ''
        continue-on-error: true
        run: python main.py curl_cffi

      # 先只抓详情页，把新出现的目标中版权下架的小说标记出来（已检查过的记在 out/epub_checked.txt）
      - name: Check copyright-removed books
        if: github.event_name != 'push'
        run: python build_batch.py --check-blocked --scraper curl_cffi --time-budget 10

      - name: Build
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            ARGS="--max-novels 3"                      # 推送触发：仅做冒烟测试
          elif [ -n "${{ inputs.aid }}" ]; then
            ARGS="--aid ${{ inputs.aid }}"
          else
            ARGS="--max-novels ${{ inputs.max_novels || 0 }} --time-budget ${{ inputs.time_budget || 40 }}"
          fi
          python build_batch.py --scraper curl_cffi $ARGS

      - name: Commit index
        if: always()
        run: |
          git config user.name "mojimoon"
          git config user.email "109803649+mojimoon@users.noreply.github.com"
          git add out/ docs/
          git diff --staged --quiet && exit 0
          git commit -m "chore: auto update on $(date +'%Y-%m-%d %H:%M:%S')"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
          # GITHUB_TOKEN 的 push 不会触发其他工作流，这里显式触发 Pages 部署（只重新生成页面，不爬取）
          [ "${GITHUB_REF_NAME}" = "main" ] && gh workflow run deploy.yml --ref main || true
