name: Scrape and Deploy

on:
  push:
    branches:
      - main
  schedule:
    - cron: '30 4-23/12 * * *'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Install Playwright browsers
      run: |
        python -m playwright install --with-deps

    - name: Setup secrets
      run: |
        echo "${{ secrets.WENKU_COOKIES }}" > COOKIE
        echo "STEEL_API_KEY=${{ secrets.STEEL_API_KEY }}" > .env
    
    - name: Run main.py
      run: |
        python main.py

    - name: Commit CSV and pages to main
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add out/ docs/
        git diff --staged --quiet || git commit -m "chore: update scraped data and pages [skip ci]"
        git push
