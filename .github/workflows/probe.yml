name: Probe wenku8 access

# 一次性探针：在 runner 上比较多种访问 wenku8 的方案（每种方案一个 job，成败看 job 结论）
on:
  workflow_dispatch:
  push:
    branches: [beta]
    paths: [.github/workflows/probe.yml, probe_actions.py]

concurrency:
  group: probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: probe-${{ matrix.strategy }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        strategy: [requests, curl_cffi, chrome_headed, patchright, camoufox, steel, worker, warp]
    env:
      STEEL_API_KEY: ${{ secrets.STEEL_API_KEY }}
      WORKER_URL: ${{ secrets.WORKER_URL }}
      WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Setup cookie
        run: echo "${{ secrets.WENKU_COOKIES }}" > COOKIE

      - name: Skip check
        id: gate
        run: |
          s="${{ matrix.strategy }}"
          if [ "$s" = steel ] && [ -z "$STEEL_API_KEY" ]; then echo "run=no" >> $GITHUB_OUTPUT
          elif [ "$s" = worker ] && [ -z "$WORKER_URL" ]; then echo "run=no" >> $GITHUB_OUTPUT
          else echo "run=yes" >> $GITHUB_OUTPUT; fi

      - name: Install deps
        if: steps.gate.outputs.run == 'yes'
        run: |
          case "${{ matrix.strategy }}" in
            curl_cffi) pip install curl_cffi ;;
            chrome_headed) pip install playwright && python -m playwright install --with-deps chrome && sudo apt-get install -y xvfb ;;
            patchright) pip install patchright && python -m patchright install --with-deps chrome && sudo apt-get install -y xvfb ;;
            camoufox) pip install -U "camoufox[geoip]" && python -m camoufox fetch && sudo apt-get install -y xvfb ;;
            steel) pip install steel-sdk playwright ;;
            warp)
              sudo apt-get update && sudo apt-get install -y wireguard-tools resolvconf
              curl -fsSL -o wgcf https://github.com/ViRb3/wgcf/releases/download/v2.2.22/wgcf_2.2.22_linux_amd64
              chmod +x wgcf && ./wgcf register --accept-tos && ./wgcf generate ;;
          esac

      - name: Bring up WARP
        if: steps.gate.outputs.run == 'yes' && matrix.strategy == 'warp'
        run: |
          # 只把 Cloudflare 网段的流量走 WARP，避免切断 runner 与 GitHub 的连接
          sed -i -E 's#^AllowedIPs.*#AllowedIPs = 104.16.0.0/12, 172.64.0.0/13, 188.114.96.0/20#; /^DNS/d; s/^Address = (.*), .*/Address = \1/' wgcf-profile.conf
          sudo cp wgcf-profile.conf /etc/wireguard/wgcf.conf
          sudo wg-quick up wgcf
          curl -s --max-time 10 https://www.cloudflare.com/cdn-cgi/trace | grep -E "^(ip|warp)=" || true

      - name: Probe
        if: steps.gate.outputs.run == 'yes'
        run: |
          case "${{ matrix.strategy }}" in
            chrome_headed|patchright|camoufox) xvfb-run -a python probe_actions.py "${{ matrix.strategy }}" ;;
            warp) python probe_actions.py requests ;;
            *) python probe_actions.py "${{ matrix.strategy }}" ;;
          esac
