function volName(it,b,k){
 var n=('0'+vno(b,k)).slice(-2);
 return ('['+it.n+'-'+n+'] '+[it.t,b.v[k][0],it.au].filter(Boolean).join(' - ')).replace(/[\\\/:*?"<>|]/g,'_')+'.epub';
}
function save(u,name){
 return fetch(u).then(function(r){if(!r.ok)throw r.status;return r.blob()}).then(function(bl){
  var a=document.createElement('a'),o=URL.createObjectURL(bl);a.href=o;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(o)},30000);
 }).catch(function(){go(u)});
}
function saveAll(it,b){
 var i=0;(function next(){if(i>=b.v.length){toast('全部 '+b.v.length+' 卷已下载');return}
  toast('正在下载 '+(i+1)+' / '+b.v.length+'：'+b.v[i][0]);
  save(volUrl(it.n,b,i),volName(it,b,i)).then(function(){i++;setTimeout(next,400)})})();
}
function openLz(it){
 if(it.p){copy(it.p);toast('密码 '+it.p+' 已复制')}
 window.open(LZ+it.l,'_blank','noopener');
}
function issueUrl(it){
 var vs=($('rq-v').value||'').replace(/[^0-9,]/g,'')||'all';
 var body='aid: '+it.n+'\nvolumes: '+vs+'\nmax_side: '+$('rq-r').value+'\nimages: '+($('rq-i').checked?'no':'yes')
  +'\n\n> 直接提交即可；GitHub Actions 将自动生成并回复下载链接。觉得好用的话记得点个 Star⭐';
 return 'https://github.com/'+REPO+'/issues/new?template=build-request.md&title='+encodeURIComponent('[build] '+it.n+' '+it.t)+'&body='+encodeURIComponent(body);
}
list.addEventListener('click',function(e){
 var li=e.target.closest('li[data-i]');if(!li)return;
 var it=items[li.dataset.i],b=e.target.closest('.tb');
 if(b){
  var a=b.dataset.a;
  if(a==='lz')return openLz(it);
  if(a==='txt')return go(txtUrl(it));
 }
 openDlg(it);
});

// ── 详情弹窗（左：信息，右：按钮） ──
var dlg=$('dlg'),cur=null;
var stText=function(s){return s==null?'':(s&1?'已完结':'连载中')+(s&2?' · 已动画化':'')};
function infoSec(it){
 if(it.w==null&&it.g==null&&it.f==null)return '';   // 没有对应到 wenku8 目录
 var r=function(k,v){return v?'<dt>'+k+'</dt><dd>'+v+'</dd>':''},n=+it.n;
 return '<div class="sec info">'+(it.nc?'':'<img src="https://img.wenku8.com/image/'+Math.floor(n/1000)+'/'+n+'/'+n+'s.jpg" alt="封面" loading="lazy" referrerpolicy="no-referrer">')
  +'<dl>'+r('文库',it.f!=null&&esc(D.pb[it.f]))+r('状态',stText(it.s))+r('字数',fmtLen(it.c))+r('文库更新',esc(it.w||''))
  +r('标签',(it.g||'').split('').map(function(c){return '<button class="tg" data-a="tag" data-g="'+c+'" title="只看此标签">'+esc(D.tg[TC.indexOf(c)])+'</button>'}).join(''))+'</dl></div>';
}
var VN={'orig':'插图原图','1600':'插图 1600px','1400':'插图 1400px','1000':'插图 1000px','800':'插图 800px','600':'插图 600px','noimg':'无插图'};
function openDlg(it){
 cur=it;var h=infoSec(it),bs=it.B||[];
 $('dt').innerHTML=esc(it.t)+cp(it.t)+'<small>'+(it.a?esc(it.a)+cp(it.a)+' · ':'')+(it.au?esc(it.au)+cp(it.au)+' · ':'')+esc(it.u||'')+'</small>';
 $('dw').style.display=it.n?'inline-flex':'none';
 if(it.n)$('dw').href='https://www.wenku8.net/book/'+it.n+'.htm';else $('dw').removeAttribute('href');
 if(it.l){
  h+='<div class="sec"><div class="r w"><div class="rl"><i class="p e">蓝奏 EPUB</i>'+(it.r?'<i class="p k">'+esc(it.r)+'</i>':'')+esc(it.v||'')+(it.du?'<small>'+esc(it.du)+'</small>':'')+'</div>'
   +'<div class="rr">'+(it.p?'<span>密码 <code>'+esc(it.p)+'</code>'+cp(it.p)+'</span>':'')+'<button class="btn" data-a="lz">'+(it.p?'复制密码打开':'打开')+'</button></div></div></div>';
 }
 // 重制版：每个分辨率一个可折叠分组（已按分辨率从高到低排序），默认展开最高的
 bs.forEach(function(b,bi){
  h+='<div class="sec"><details class="vg"'+(bi?'':' open')+'><summary><span class="rl"><i class="p n">重制</i>'+VN[b.d||'1000']+'<small>'+[b.u,b.v.length+(b.n?' / '+b.n:'')+' 卷'].filter(Boolean).join(' · ')+'</small></span>'
   +(b.v.length>1?'<button class="btn s" data-a="all" data-k="'+bi+'">依次下载全部</button>':'')+'</summary>';
  b.v.forEach(function(v,k){h+='<div class="r"><div class="rl"><span class="vi" title="卷序号（目录中的顺序）">'+vno(b,k)+'</span>'+esc(v[0])+'<small>'+fmt(v[1])+'</small></div><div class="rr"><a class="btn s" data-a="dl" data-k="'+bi+'" data-j="'+k+'" href="'+esc(volUrl(it.n,b,k))+'">下载</a></div></div>'});
  h+=(b.v.length>1?'<div class="note">“依次下载全部”会逐卷下载，如被浏览器拦截请允许“多个文件下载”。文件名为“[aid-卷序号] 书名 - 卷名 - 作者.epub”。</div>':'')
   +(b.n?'<div class="note">已生成 '+b.v.length+' / '+b.n+' 卷，其余卷可在下方请求生成。</div>':'')+'</details></div>';
 });
 if(it.x){
  h+='<div class="sec"><div class="r"><div class="rl"><i class="p t">TXT</i>纯文本 EPUB<small>'+esc(it.xu||'')+'</small></div>'
   +'<div class="rr"><a class="btn o s" href="'+esc(txtUrl(it))+'">下载</a></div></div></div>';
 }
 if(it.k){
  h+='<div class="sec"><div class="r"><div class="rl"><i class="p k">版权下架</i>轻小说文库已因版权问题下架本书正文，无法重制</div></div></div>';
 }else if(it.n&&!it.l){
  h+='<div class="sec"><details'+(bs.length?'':' open')+'><summary>'+(bs.length?'重新生成 / 其他分辨率、无图':'重制版尚未生成：请求生成')+'</summary>'
   +'<div class="r"><div class="rl">插图分辨率<small>长边像素，越小越快、文件越小</small></div><div class="rr"><select id="rq-r">'
   +'<option value="1000" selected>1000（推荐）</option><option value="1400">1400</option><option value="1600">1600</option><option value="800">800</option><option value="600">600</option><option value="0">原图</option></select></div></div>'
   +'<div class="r"><div class="rl">不含插图<small>最快，文件最小</small></div><div class="rr"><input type="checkbox" id="rq-i"></div></div>'
   +'<div class="r"><div class="rl">只生成指定卷<small>卷序号，逗号分隔；留空为全部。序号是目录中的顺序（第几个卷），不一定等于卷名中的数字</small></div><div class="rr"><input class="fi" id="rq-v" placeholder="如 1,3" inputmode="numeric"></div></div>'
   +'<div class="r w"><div class="rl"><small>将在 GitHub 打开预填的 Issue（需登录），提交后由 Actions 自动生成，约数分钟至半小时，完成后在 Issue 中回复下载链接。</small></div>'
   +'<div class="rr"><button class="btn" data-a="req">提交请求</button></div></div></details></div>';
 }

 $('db').innerHTML=h;
 if(!dlg.open)dlg.showModal();
}
$('dx').addEventListener('click',function(){dlg.close()});
dlg.addEventListener('click',function(e){if(e.target===dlg)dlg.close()});
$('db').addEventListener('click',function(e){
 var t=e.target.closest('[data-a]');if(!t)return;
 if(t.closest('summary'))e.preventDefault();   // 标题行里的按钮不触发折叠
 var a=t.dataset.a,b=(cur.B||[])[t.dataset.k||0];
 if(a==='lz')openLz(cur);
 else if(a==='all')saveAll(cur,b);
 else if(a==='dl'){e.preventDefault();toast('正在下载：'+b.v[t.dataset.j][0]);save(t.href,volName(cur,b,+t.dataset.j))}
 else if(a==='tag'){F.g=t.dataset.g;syncF();showF(true);dlg.close();applyFilter()}
 else if(a==='req')window.open(issueUrl(cur),'_blank','noopener');
});

// ?f=epub|new|txt 预设筛选（兼容旧版 epub.html）
var pf=new URLSearchParams(location.search).get('f'),pb=pf&&document.querySelector('.chip[data-f="'+pf+'"]');
if(pb)pb.click();else applyFilter();
})();
</script>
</body>
</html>
