 bs.forEach(function(b,bi){

   +(b.n?'<div class="note">已生成 '+b.v.length+' / '+b.n+' 卷，其余卷可在下方请求生成。</div>':'')+'</details></div>';
 });
 if(it.x){

 }
 if(it.k){

 }else if(it.n&&!it.l){
  h+='<div class="sec"><details'+(bs.length?'':' open')+'><summary>'+(bs.length?'重新生成 / 其他分辨率、无图':'重制版尚未生成：请求生成')+'</summary>'

   +'<div class="r w"><div class="rl"><small>将在 GitHub 打开预填的 Issue（需登录），提交后由 Actions 自动生成，约数分钟至半小时，完成后在 Issue 中回复下载链接。</small></div>'
   +'<div class="rr"><button class="btn" data-a="req">提交请求</button></div></div></details></div>';
 }

 $('db').innerHTML=h;
